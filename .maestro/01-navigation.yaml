# Maestro UI test – screens, setup options and menus.
# Run:  maestro test .maestro/01-navigation.yaml   (app must be installed, Metro running)
appId: org.reactjs.native.example.Game502
name: Navigation, setup and in-game menus
---
- launchApp:
    clearState: true

# ---- Home screen ----
- assertVisible: "502"
- assertVisible: "Shed your cards. Stay under 502."
- assertVisible: "Create Room"
- takeScreenshot: docs/screenshots/home

# ---- How to play ----
- tapOn: "How to play"
- assertVisible: "How to play 502"
- tapOn: "Got it"

# ---- Room: Back returns home ----
- tapOn: "Create Room"
- assertVisible: "Your room"
- tapOn: "Back"
- assertVisible: "Create Room"

# ---- Room: you + 2 bots by default; add and remove bots ----
- tapOn: "Create Room"
- assertVisible: "Players at the table · 3/6"
- tapOn: "+ Add AI bot"
- assertVisible: "Players at the table · 4/6"
- tapOn: "Remove Luna"
- assertVisible: "Players at the table · 3/6"

# ---- Room: rename you and both bots ----
- tapOn:
    id: "name-input"
- inputText: "Nouman"
- tapOn:
    id: "bot-name-0"
- inputText: "Ali"
- tapOn:
    id: "bot-name-1"
- inputText: "Sara"
- tapOn: "Your room"   # tap outside the field to close the keyboard
- takeScreenshot: docs/screenshots/setup
- tapOn: "Start game"
- assertVisible: "Round 1"
- assertVisible: "Nouman · 0 pts"
- assertVisible: "Ali"
- assertVisible: "Sara"
- assertVisible: "Round 1 – first turn: Nouman."
- assertVisible: "Your turn"
- assertVisible: "Follow .*"

# ---- Scoreboard opens and closes ----
- tapOn: "Scores"
- assertVisible: "Scoreboard"
- assertVisible: "502 points or more = eliminated"
- tapOn: "Close"
- assertNotVisible: "Scoreboard"

# ---- Restart: cancel keeps the game, confirm deals a new one ----
- tapOn: "Restart"
- assertVisible: "Restart game?"
- tapOn: "Cancel"
- assertVisible: "Round 1"
- tapOn: "Restart"
- tapOn: "Yes, restart"
- assertVisible: "Round 1 – first turn: Nouman."
- assertVisible: "Your turn"

# ---- Quit: "Stay" keeps you in, "Yes, leave" goes home ----
- tapOn: "Quit"
- assertVisible: "Leave game?"
- tapOn: "Stay"
- assertVisible: "Round 1"
- tapOn: "Quit"
- tapOn: "Yes, leave"
- assertVisible: "Create Room"
